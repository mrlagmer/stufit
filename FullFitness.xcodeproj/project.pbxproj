			inputPaths = (
				"$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/onnxruntime.framework/onnxruntime",
			);
			name = "Fix onnxruntime framework for App Store";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(DWARF_DSYM_FOLDER_PATH)/onnxruntime.framework.dSYM/Contents/Info.plist",
				"$(DWARF_DSYM_FOLDER_PATH)/onnxruntime.framework.dSYM/Contents/Resources/DWARF/onnxruntime",
				"$(DWARF_DSYM_FOLDER_PATH)/onnxruntime.framework.dSYM/Contents/Resources/Relocations/aarch64/onnxruntime.yml",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# The onnxruntime SPM binary framework fails App Store validation two ways:\n# it ships no dSYM, and its Info.plist MinimumOSVersion (15.1) contradicts the\n# minos the dylib is actually linked with at build time (TMS-90208).\n# Use the dylib embedded in the app bundle via TARGET_BUILD_DIR (points at the\n# installed app during archive builds). The onnxruntime.framework copy at the\n# top level of BUILT_PRODUCTS_DIR is a static library that dsymutil rejects.\nFRAMEWORK_DIR=\"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/onnxruntime.framework\"\nif [ \"${DEBUG_INFORMATION_FORMAT}\" = \"dwarf-with-dsym\" ] && [ -f \"${FRAMEWORK_DIR}/onnxruntime\" ]; then\n  plutil -replace MinimumOSVersion -string \"${IPHONEOS_DEPLOYMENT_TARGET}\" \"${FRAMEWORK_DIR}/Info.plist\"\n  # The plist is covered by the framework's code signature seal, so re-sign.\n  if [ \"${CODE_SIGNING_ALLOWED}\" = \"YES\" ] && [ -n \"${EXPANDED_CODE_SIGN_IDENTITY}\" ]; then\n    codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --preserve-metadata=identifier,entitlements,flags \"${FRAMEWORK_DIR}\"\n  fi\n  dsymutil \"${FRAMEWORK_DIR}/onnxruntime\" -o \"${DWARF_DSYM_FOLDER_PATH}/onnxruntime.framework.dSYM\"\nfi\n";
		};
